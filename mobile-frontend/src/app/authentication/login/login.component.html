<section id="restaurant-login" class="book-a-table section">
  <div class="container section-title" data-aos="fade-up">
    <h2>Restaurant Login</h2>
    <p>
      <span>Welcome Back</span>
      <span class="description-title">Let’s Get Cooking</span>
    </p>
  </div>

  <div class="container">
    <div class="row g-0" data-aos="fade-up" data-aos-delay="100">
      <div class="container section-title" data-aos="fade-up">
        <p>
          <span>Login !</span>
        </p>
      </div>

      <div class="col-lg-8 d-flex align-items-center"  style="background-color: #fffaf0; border-radius: 5px;" data-aos="fade-up" data-aos-delay="200">
        <form [formGroup]="loginform" (ngSubmit)="onSubmit()" class="php-email-form w-100">
          <div class="row gy-4">
            <!-- Email Address -->
            <div class="col-lg-12">
              <label class="form-label">Email address <span class="text-danger">*</span></label>
              <input
                type="email"
                class="form-control"
                formControlName="username"
                placeholder="Eg. jason.bradman@xiamin.com"
              />
              <div *ngIf="(f.username.touched || f.username.dirty) && f.username.invalid" class="text-danger mt-1">
                <div *ngIf="f.username.errors?.required">Please enter email address.</div>
                <div *ngIf="f.username.errors?.email">Email address must be valid.</div>
              </div>
            </div>

            <!-- Password -->
            <div class="col-lg-12">
              <label class="form-label">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control"
                  formControlName="password"
                  placeholder="Eg. Pass@12345"
                />
                <span class="input-group-text" style="cursor: pointer;" (click)="togglePasswordVisibility()">
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                </span>
              </div>
              <div *ngIf="(f.password.touched || f.password.dirty) && f.password.invalid" class="text-danger mt-1">
                <div *ngIf="f.password.errors?.required">Please enter password.</div>
              </div>
            </div>

            <!-- Invalid Creds -->
            <div class="col-lg-12" *ngIf="invalidCreds">
              <div class="text-danger mt-1">Invalid Credentials!</div>
            </div>

            <!-- Options -->
            <div class="col-lg-12 d-flex justify-content-between align-items-center mt-2">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" />
                <label for="rememberMe" class="form-check-label small">Remember me</label>
              </div>
              <a routerLink="/auth/forgot-password" class="small" style="color: #ce1212;">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <div class="d-flex justify-content-center align-items-center mt-4">
              <button
              class="btn btn-primary w-100 text-center d-flex justify-content-center align-items-center"
                type="submit"
                [disabled]="loginform.invalid || isLoading"
              >
                {{ isLoading ? 'Signing In...' : 'Sign In' }}
              </button>
            </div>

            <!-- Extra Info -->
            <div class="col-lg-12 text-center mt-3">
              <small>This site is protected by MFA and the Google Privacy Policy and Terms of Service apply.</small>
              <p class="mt-3 mb-0">
                Not registered yet?
                <a routerLink="/auth/register" class="fw-medium" style="color: #ce1212;">Register here</a>
              </p>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
