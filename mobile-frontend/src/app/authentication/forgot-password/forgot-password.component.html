<section id="forgot-password" class="book-a-table section">
  <div class="container section-title" data-aos="fade-up">
    <h2>Forgot Password</h2>
    <p>
      <span>Reset Access</span>
      <span class="description-title">We'll help you get back in</span>
    </p>
  </div>

  <div class="container">
    <div class="row g-0" data-aos="fade-up" data-aos-delay="100">
      <div class="container section-title" data-aos="fade-up">
        <p>
          <span>Forgot?</span>
        </p>
      </div>
      <div class="col-lg-12 text-center">
        <small>Please enter your registered email for recovery.</small>
      </div>
      <div class="col-lg-8 d-flex align-items-center mt-3"  style="background-color: #fffaf0; border-radius: 5px;" data-aos="fade-up" data-aos-delay="200">
        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="php-email-form w-100">
          <div class="row gy-4">
            <!-- Email Field -->
            <div class="col-lg-12">
              <label class="form-label">Email Address <span class="text-danger">*</span></label>
              <input
                type="email"
                class="form-control"
                formControlName="email"
                placeholder="Enter your registered email"
              />
              <div *ngIf="f.email.touched && f.email.invalid" class="text-danger mt-1">
                <div *ngIf="f.email.errors?.required">Please enter your email address.</div>
                <div *ngIf="f.email.errors?.email">Enter a valid email.</div>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-flex justify-content-center align-items-center mt-4">
              <button
              class="btn btn-primary w-100 text-center d-flex justify-content-center align-items-center"
                type="submit"
                [disabled]="forgotPasswordForm.invalid || isLoading"
              >
                {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
              </button>
            </div>

            <!-- Status Message -->
            <div class="col-lg-12 text-center mt-3" *ngIf="emailSent">
              <span class="text-success">Password reset link sent! Check your email.</span>
            </div>

            <div class="col-lg-12 text-center mt-3" *ngIf="emailNotFound">
              <span class="text-danger">Email not found in our system.</span>
            </div>

            <!-- Back to Login -->
            <div class="col-lg-12 text-center mt-4">
              <p class="mb-0">
                Remembered your password?
                <a routerLink="/auth/login" class="fw-medium" style="color: #ce1212;">Back to Login</a>
              </p>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
