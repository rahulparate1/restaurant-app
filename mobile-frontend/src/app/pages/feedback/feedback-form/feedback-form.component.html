<section id="feedback" class="book-a-table section">
  <div class="container section-title" data-aos="fade-up">
    <h2>Share Your Feedback 🍽️</h2>
    <p>
      <span>We Value Your Thoughts!</span>
      <span class="description-title">Make Us Even Better!</span>
    </p>
  </div>

  <div class="container">
    <div class="row g-0" data-aos="fade-up" data-aos-delay="100">
      <div class="col-lg-8 mx-auto d-flex align-items-center" style="background-color: #fffaf0; border-radius: 20px;">
        <form [formGroup]="feedbackForm" (ngSubmit)="onSubmit()" class="php-email-form w-100 p-4">
          <div class="row gy-4">


            <div class="col-12">
              <label class="form-label">Customer Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="customerName" placeholder="e.g. John Doe" />
              <div *ngIf="form['customerName'].invalid && (form['customerName'].dirty || form['customerName'].touched)"
                class="text-danger mt-1">
                <small>Customer Name is required.</small>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label">Feedback (Optional)</label>
              <textarea class="form-control" rows="4" formControlName="description"
                placeholder="Tell us what you loved (or didn't!)..."></textarea>
            </div>


            <!-- Rating -->
            <div class="col-12">
              <label class="form-label">How was your experience?</label>
              <div class="rating-circles d-flex justify-content-center flex-wrap">
                <div *ngFor="let num of numbers" class="rating-circle" [class.selected]="selectedRating === num"
                  (click)="selectRating(num)">
                  {{ selectedRating === num ? '😊' : num }}
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-center align-items-center mt-4">
              <button class="btn w-100 text-center d-flex justify-content-center align-items-center" type="submit"
                style="background-color: #ce1212; color: #fff;">
                Submit Feedback 🚀
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
