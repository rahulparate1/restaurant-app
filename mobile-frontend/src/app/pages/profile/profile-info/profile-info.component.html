<header class="mobile-header d-md-none bg-white px-3 py-3 d-flex align-items-center justify-content-between shadow-sm"
        style="position: sticky; top: 0; z-index: 1050; height: 72px;">

  <!-- Center: Search Bar -->
  <div class="flex-grow-1 me-3">
    <input type="text" class="form-control rounded-pill border-0 shadow-sm px-3"
           placeholder="Search delicious food..."
           style="background-color: #f1f1f1; font-size: 0.95rem;">
  </div>

  <!-- Right: Profile Icon -->
  <div style="color: #ce1212;">
    <a (click)="goToProfile()"><i class="bi bi-person-circle" style="font-size: 2rem;"></i></a>
  </div>

</header>

<section id="restaurant-profile" class="section" style="margin-top: 15px; padding: 0;">
  <div class="container">

    <!-- 🔙 Back Button -->
    <div class="d-flex align-items-center" style="cursor: pointer;">

    <div class="row">

            style="top: 12px; right: 12px; background-color: #ce1212; color: white; border-radius: 50%; width: 36px; height: 36px;"

              src="https://d2az3zd39o5d63.cloudfront.net/linkedin-profile-picture-squinch.jpg"

            />
            <div>
              <h5 class="mb-0">Rahul Parate <small class="text-muted">(admin)</small></h5>
              <small class="text-muted">Restaurant Owner</small>
            </div>
          </div>

          <hr style="border-color: #ce1212;" />

          <h5 class="mb-3 text-center fw-bold text-danger">Profile Info</h5>

          <ul class="list-unstyled">
            <li class="mb-3 d-flex align-items-center">
              <i class="bi bi-envelope-fill text-danger me-3"></i>
              <span>rahul11115yopmail.com</span>
            </li>
            <li class="mb-3 d-flex align-items-center">
              <i class="bi bi-phone-fill text-danger me-3"></i>
              <span>9049878945</span>
            </li>
            <li class="mb-3 d-flex align-items-center">
              <i class="bi bi-hash text-danger me-3"></i>
              <span>1234567890</span>
            </li>
            <li class="mb-3 d-flex align-items-center">
              <i class="bi bi-shop-window text-danger me-3"></i>
              <span>LOC Cafe</span>
            </li>
            <li class="mb-3 d-flex align-items-start">
              <i class="bi bi-geo-alt-fill text-danger me-3 mt-1"></i>
              <span>A108 Adam Street, New York, NY 535022</span>
            </li>
          </ul>

        </div>
      </div>

      <!-- Right Main Content -->
      <div class="col-md-8">
        <div class="bg-white shadow-sm rounded-4 p-4" style="background-color: #fffaf0;">
          <h5 class="mb-4 text-danger fw-bold">Quick Links</h5>
          <ul class="list-unstyled" style="font-size: 0.95rem;">
            <li class="mb-3 d-flex align-items-center hover-effect">
              <i class="bi bi-house-door-fill me-3 fs-5 text-danger"></i> Dashboard
            </li>
            <li class="mb-3 d-flex align-items-center hover-effect">
              <i class="bi bi-gear-fill me-3 fs-5 text-danger"></i> Settings
            </li>
            <li class="mb-3 d-flex align-items-center hover-effect">
              <i class="bi bi-person-fill me-3 fs-5 text-danger"></i> Profile Info
            </li>
            <li class="mb-3 d-flex align-items-center hover-effect">
              <i class="bi bi-question-circle-fill me-3 fs-5 text-danger"></i> Help Center
            </li>
            <li class="mb-3 d-flex align-items-center hover-effect">
              <a (click)="logout()" class="d-flex align-items-center text-danger" style="text-decoration: none;">
                <i class="bi bi-box-arrow-right me-3 fs-5 text-danger"></i> Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
