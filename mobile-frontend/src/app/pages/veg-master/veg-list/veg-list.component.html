<header class="mobile-header d-md-none bg-white px-3 py-3 d-flex align-items-center justify-content-between shadow-sm"
style="position: sticky; top: 0; z-index: 1050; height: 72px;">

<!-- Center: Search Bar -->
<div class="flex-grow-1 me-3">
<input type="text" class="form-control rounded-pill border-0 shadow-sm px-3"
   placeholder="Search delicious food..."
   style="background-color: #f1f1f1; font-size: 0.95rem;">
</div>

<!-- Right: Profile Icon -->
<div style="color: #ce1212;">
<a (click)="goToProfile()"><i class="bi bi-person-circle" style="font-size: 2rem;"></i></a>
</div>

</header>

























































































<section id="menu" class="menu section">
  <div class="container section-title" data-aos="fade-up">
    <h2>Our Menu</h2>
    <p><span>Check Our</span> <span class="description-title">Yummy Menu</span></p>
  </div>

  <div class="container">
    <div class="row g-4">
      <div class="col-12 col-md-6" *ngFor="let item of menuItems">
        <div
          class="card custom-card shadow-lg border-0 p-3 h-100"
        >
          <div class="text-center p-2">
            <img
              [src]="item.image"
              class="img-fluid rounded-3 menu-image"
              alt="{{item.name}}"
            />
          </div>
          <div class="card-body p-2">
            <h5 class="card-title fw-semibold mb-1">{{ item.name }}</h5>
            <p class="card-text text-muted small mb-2">{{ item.ingredients }}</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-bold" style="color: #ce1212;">${{ item.price }}</span>
              <div class="d-flex align-items-center gap-2">
                <button
                  class="btn btn-square quantity-btn"
                  (click)="decreaseQuantity(item)"
                >-</button>
                <span class="fw-semibold px-2">{{ item.quantity }}</span>
                <button
                  class="btn btn-square quantity-btn"
                  (click)="increaseQuantity(item)"
                >+</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<button
  class="fab-add-menu-btn"
  (click)="addNewMenu()"
  aria-label="Add Menu"
>
  <i class="bi bi-plus-lg"></i>
</button>

      <a href="#home" class="nav-item flex-fill text-decoration-none" style="color: #ce1212;">

          <i class="bi bi-house-door-fill" style="font-size: 1.9rem;"></i>
          <!-- <div class="fw-bold small">Home</div> -->

        <div>
          <i class="bi bi-egg-fried" style="font-size: 1.9rem;"></i>
          <!-- <div class="fw-bold small">Menu</div> -->
        </div>
      </a>
      <a href="#offers" class="nav-item flex-fill text-decoration-none" style="color: #ce1212;">
        <div>
