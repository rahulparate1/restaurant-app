<section id="veg-item" class="book-a-table section">
  <div class="container section-title" data-aos="fade-up">
    <h2>{{ id ? 'Edit' : 'Add' }} Vegetarian Item</h2>
    <p>
      <span>Your Veg Dish</span>
      <span class="description-title">Healthy, Tasty & Green</span>
    </p>
  </div>

  <div class="container">
    <div class="row g-0" data-aos="fade-up" data-aos-delay="100">
      <div class="col-lg-10 d-flex align-items-center" style="background-color: #fffaf0; border-radius: 10px;"
        data-aos="fade-up" data-aos-delay="200">
        <form [formGroup]="vegItemForm" (ngSubmit)="onSubmit()" class="php-email-form w-100 p-4">
          <div class="row gy-4">

            <!-- Item Name -->
            <div class="col-lg-6 col-md-6">
              <label class="form-label">Item Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="name" placeholder="e.g. Paneer Tikka" />
              <div *ngIf="form['name'].invalid && (form['name'].dirty || form['name'].touched)"
                class="text-danger mt-1">
                <small *ngIf="form['name'].errors?.['required']">Item Name is required.</small>
              </div>
            </div>

            <!-- Item Category -->
            <div class="col-lg-6 col-md-6">
              <label class="form-label">Item Category <span class="text-danger">*</span></label>
              <select
                formControlName="categoryId"
                class="form-control"
                [ngClass]="{ 'is-invalid': form['categoryId'].invalid && (form['categoryId'].dirty || form['categoryId'].touched) }"
                (change)="onCategoryChange($event)"
              >
                <!-- Placeholder -->
                <option value="" disabled selected>Select a Category</option>

                <!-- Populate categories -->
                <option *ngFor="let category of categoryList" [value]="category.id">{{ category.title }}</option>
              </select>
              <div *ngIf="form['categoryId'].invalid && (form['categoryId'].dirty || form['categoryId'].touched)" class="text-danger mt-1">
                <small>Category is required.</small>
              </div>
            </div>

            <!-- Price -->
            <div class="col-lg-6 col-md-6">
              <label class="form-label">Price (₹) <span class="text-danger">*</span></label>
              <input type="number" class="form-control" formControlName="price" placeholder="e.g. 150" />
              <div *ngIf="form['price'].invalid && (form['price'].dirty || form['price'].touched)"
                class="text-danger mt-1">
                <small>Price is required and must be positive.</small>
              </div>
            </div>

            <!-- Image URL -->
            <div class="col-lg-6 col-md-6">
              <label class="form-label">Image URL <span class="text-danger">*</span></label>
              <input type="url" class="form-control" formControlName="image" placeholder="e.g. https://image.url" />
              <div *ngIf="form['image'].invalid && (form['image'].dirty || form['image'].touched)"
                class="text-danger mt-1">
                <small>Valid image URL is required.</small>
              </div>
            </div>

            <!-- Status -->
            <div class="col-lg-6 col-md-6">
              <label class="form-label">Status <span class="text-danger">*</span></label>
              <select
                formControlName="status"
                class="form-control"
                [ngClass]="{ 'is-invalid': form['status'].invalid && (form['status'].dirty || form['status'].touched) }"
              >
                <!-- Placeholder -->
                <option value="" disabled selected>Select Status</option>
                <option value="available">Available</option>
                <option value="notAvailable">Not Available</option>
              </select>
              <div *ngIf="form['status'].invalid && (form['status'].dirty || form['status'].touched)" class="text-danger mt-1">
                <small>Status is required.</small>
              </div>
            </div>

              <!-- Ratings -->
              <div class="col-lg-3 col-md-6">
                <label class="form-label">Rating</label>
                <input type="number" class="form-control" formControlName="rating" min="0" max="5"
                  placeholder="e.g. 4.5" />
              </div>

              <!-- Discount -->
              <div class="col-lg-3 col-md-6">
                <label class="form-label">Discount (%)</label>
                <input type="number" class="form-control" formControlName="discount" placeholder="e.g. 10" />
              </div>

               <!-- Description -->
            <div class="col-lg-12">
              <label class="form-label">Description <span class="text-danger">*</span></label>
              <textarea class="form-control" rows="3" formControlName="description"
                placeholder="Delicious and spicy..."></textarea>
              <div *ngIf="form['description'].invalid && (form['description'].dirty || form['description'].touched)"
                class="text-danger mt-1">
                <small>Description is required.</small>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-flex justify-content-center align-items-center mt-4">
              <button class="btn btn-primary w-100 text-center d-flex justify-content-center align-items-center" type="submit" [disabled]="vegItemForm.invalid">
                {{ id ? 'Update Item' : 'Add Item' }}
              </button>
            </div>

          </div>
        </form>
      </div>
    </div>
  </div>
</section>
