<div class="container-fluid">
  <app-page-title title="Leave Type Form" [breadcrumbItems]="breadCrumbItems"></app-page-title>
  <div class="row">
    <div class="col-6">
      <form [formGroup]="leaveTypeForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-body border-bottom">
                <div>
                  <h6 class="card-title">Leave Type Details</h6>
                  <p class="card-title-desc mb-0">
                    Enter the details for the leave type.
                  </p>
                </div>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-12 mt-3">
                    <label for="leaveTypeNameInput" class="col-form-label">Leave Type Name<span
                        class="asterisk">*</span></label>
                    <div>
                      <input type="text" class="form-control" placeholder="Eg. Sick leave"
                        formControlName="name" minlength="5" maxlength="50">
                      <div
                        *ngIf="leaveTypeForm.get('name').invalid && (leaveTypeForm.get('name').dirty || leaveTypeForm.get('name').touched)"
                        class="text-danger">
                        <div *ngIf="leaveTypeForm.get('name').errors.required">
                          Leave Type Name is required.
                        </div>
                        <div *ngIf="leaveTypeForm.get('name').errors.minlength">
                          Leave Type Name must be at least 5 characters.
                        </div>
                        <div *ngIf="leaveTypeForm.get('name').errors.maxlength">
                          Leave Type Name must be less than 50 characters.
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 mt-3">
                    <label for="toTimeInput" class="col-form-label">Description<span class="asterisk">*</span></label>
                    <div>
                      <textarea type="time" class="form-control" formControlName="description"
                        placeholder="Eg. Sick leave"></textarea>
                      <div
                        *ngIf="leaveTypeForm.get('description').invalid && (leaveTypeForm.get('description').dirty || leaveTypeForm.get('description').touched)"
                        class="text-danger">
                        <div *ngIf="leaveTypeForm.get('description').errors.required">
                          Description is required.
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Submit and Cancel Buttons -->
                  <div class="col-12 d-flex justify-content-start align-items-center gap-2" style="margin-top: 15px;">
                    <button type="submit" class="btn btn-primary btn-md" [disabled]="!leaveTypeForm.valid">
                      <i class="bx bx-check-double font-size-16 align-middle me-2"></i> Save
                    </button>
                    <button type="button" class="btn btn-dark btn-md" (click)="navigateToList()">
                      <i class="bx bx-x-circle font-size-16 align-middle me-2"></i> Cancel
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
